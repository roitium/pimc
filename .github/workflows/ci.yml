name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VAULT_GIT_URL: ${{ vars.VAULT_GIT_URL }}
      VAULT_GIT_TOKEN: ${{ secrets.VAULT_GIT_TOKEN }}
      VAULT_GIT_REF: ${{ vars.VAULT_GIT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run --filter @pimc/content check
      - if: env.VAULT_GIT_URL != ''
        run: bun run check
      - run: bun run lint
      - run: bun run format:check
      - if: env.VAULT_GIT_URL != ''
        run: bun run test:smoke
      - if: env.VAULT_GIT_URL != ''
        run: bun run build
